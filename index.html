<script>
  if ('serviceWorker' in navigator) {
    // ¿ya había una versión controlando la página al cargar?
    var habiaControlador = !!navigator.serviceWorker.controller;
    var recargando = false;

    // cuando entra una versión nueva, se recarga una vez sola
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!habiaControlador || recargando) return;
      recargando = true;
      location.reload();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.update();
      }).catch(function (e) {
        console.log('Sin service worker (normal si abres por http sin cifrar):', e.message);
      });
    });
  }
</script>
